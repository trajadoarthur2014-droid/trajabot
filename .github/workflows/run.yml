# START
"name": "Ligar Bot"
"on":
  "main":
    "main":
      - "main"
  "workflow_dispatch": {}

"jobs":
  "run":
    "runs-on": "ubuntu-latest"
    "steps":
      - "uses": "actions/checkout@v4"
      - "uses": "actions/setup-node@v4"
        "with":
          "node-version": 20
      - "run": "npm install"
      - "run": "node index.js"
        "env":
          "TOKEN": "${{ secrets.TOKEN }}"
# END



